[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crumb-llm"
version = "0.1.0"
description = "CrumbLLM — the local/cloud AI engine that reads CRUMB files and packs and produces summaries, risks, next actions, PR notes, and improved handoffs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "XIO AI Solutions" }]
keywords = ["ai", "llm", "crumb", "handoff", "context", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

# CrumbLLM depends on crumb-format for the CRUMB spec, parser, and validator.
# It never re-implements the spec. See crumb_llm/crumb/parser_adapter.py.
dependencies = [
    "crumb-format>=1.1.0",
]

[project.optional-dependencies]
# Cloud providers work over stdlib HTTP, so no extra SDKs are required.
# These extras are provided for users who prefer the official SDKs.
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.39"]
# Local-from-scratch experiments. NOT installed by default and NOT required
# for any cloud or local-server provider.
scratch = [
    "torch>=2.2",
    "numpy>=1.26",
    "tiktoken>=0.7",
]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/XioAISolutions/crumb-llm"
Repository = "https://github.com/XioAISolutions/crumb-llm"

[project.scripts]
crumblm = "crumb_llm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crumb_llm*"]

[tool.setuptools.package-data]
"crumb_llm" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
