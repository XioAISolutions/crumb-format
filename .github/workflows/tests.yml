name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      # Runs on every PR, not only at release time. This is the check that was
      # missing while PyPI served a four-month-stale wheel.
      - name: Verify release metadata and that the docs match the CLI
        run: python scripts/release_check.py

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      # Prints the corpus table into the build log so the compression and
      # retention numbers are visible per run, not only when something breaks.
      # The pass/fail gate lives in tests/test_benchmarks.py.
      - name: Benchmark corpus
        run: python benchmarks/run_corpus.py
