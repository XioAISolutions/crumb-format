name: Publish to PyPI

# Three ways in, one of which needs no human and no tag push.
#
# History, because it explains every line below. The workflow first fired on
# `release: published`, which required a human to create a GitHub Release by
# hand. Between May 2026 and August 2026 nobody did, so it never ran once —
# PyPI stayed on 0.2.0 from April while the repository moved to 1.1.0 and
# gained ~40 commands. That was fixed by making a tag push sufficient.
#
# Then the tag push turned out not to be reachable either. docs/RELEASING.md
# had already recorded that tag pushes "have historically 403'd" from this
# org's automation; they still do — `git push origin v1.2.0` is rejected at
# `git-receive-pack` for refs outside the session's allowed branch, and the
# Actions dispatch API answers 403 for the same identity. A release path that
# only a human at an unrestricted terminal can walk is how this package went
# stale for four months.
#
# So: a merge to main carrying a version that has never been tagged releases
# itself. The `gate` job is what keeps that safe — it publishes only when
# `refs/tags/v<version>` does not already exist, so ordinary merges to main
# after a release are no-ops rather than republish attempts.

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag, for example v1.2.0
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Decide the tag and whether this run is a release at all. Everything
  # downstream reads `needs.gate.outputs.*` rather than the ref, so the three
  # entry points converge here into one answer.
  gate:
    if: github.repository == 'XioAISolutions/crumb-format'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_TAG:-}" ]; then
            TAG="$DISPATCH_TAG"
            REASON="workflow_dispatch"
            DELIBERATE=yes
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            REASON="tag push"
            DELIBERATE=yes
          else
            VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
            TAG="v$VERSION"
            REASON="push to ${{ github.ref_name }} at version $VERSION"
            DELIBERATE=no
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # A branch push releases only the first time it sees a new version.
          # Tag pushes and explicit dispatches are deliberate acts, so they
          # proceed even when the tag already exists.
          if [ "$DELIBERATE" = no ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already tagged; nothing to release ($REASON)."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing $TAG ($REASON)."
          fi

  build:
    needs: [gate]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: python -m pip install --upgrade build twine pytest pyyaml

      # Preflight: versions agree, docs only promise commands that exist, and
      # this workflow is still tag-triggered.
      - name: Verify release metadata
        run: python scripts/release_check.py --tag "$RELEASE_TAG"

      - name: Run the test suite
        run: python -m pytest tests/ -q

      - name: Build wheel and source distribution
        run: python -m build --outdir dist

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      # The gate that would have caught the stale-wheel failure: install the
      # artifact outside the source tree and run the README's own quickstart.
      # A release that cannot execute its own documentation must not ship.
      - name: Smoke-test the built wheel outside the source tree
        run: |
          python -m venv /tmp/crumb-release-venv
          /tmp/crumb-release-venv/bin/python -m pip install --upgrade pip
          /tmp/crumb-release-venv/bin/python -m pip install dist/*.whl
          CRUMB=/tmp/crumb-release-venv/bin/crumb
          "$CRUMB" --version
          "$CRUMB" doctor
          "$CRUMB" --help-all > /dev/null
          cp examples/transcript-checkout-openai.json /tmp/transcript.json
          cd /tmp
          "$CRUMB" from-messages -i transcript.json -o handoff.crumb --stats
          "$CRUMB" validate handoff.crumb
          "$CRUMB" measure handoff.crumb --source transcript.json --json > measure.json
          python -c "import json; d=json.load(open('measure.json')); assert d['tokens']['saved_pct'] > 80, d"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ needs.gate.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-package-${{ needs.gate.outputs.tag }}
          path: dist/
      # Creates the tag as well when the run came from a branch push, which is
      # what makes the release reachable without a local `git push --tags`.
      - name: Create the GitHub release and attach the distributions
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CRUMB ${{ needs.gate.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  publish:
    needs: [gate, build, release]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so no
      # long-lived PYPI_API_TOKEN secret is needed. The previous workflow
      # declared id-token: write and then passed an API token anyway — if the
      # secret was ever unset the publish step failed with nothing to show.
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/crumb-format
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-${{ needs.gate.outputs.tag }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
          # A re-run after a partial failure should not die on the files that
          # already landed. PyPI rejects duplicate uploads by design.
          skip-existing: true
