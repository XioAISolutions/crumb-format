name: CRUMB file inventory on PR

on:
  # Reusable workflow — other repos can call this
  workflow_call:
    inputs:
      search-path:
        description: "Root directory to search for .crumb files"
        required: false
        default: "."
        type: string
      python-version:
        description: "Python version to use"
        required: false
        default: "3.11"
        type: string

  # Also runs directly on pull requests in this repo
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    name: Inventory .crumb files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.11' }}

      - name: Install crumb-format
        # When run in the crumb-format repo itself (via pull_request trigger),
        # install from the checkout so bench reflects the PR under review.
        # When called from another repo (workflow_call), install from PyPI.
        # Previously always used `pip install crumb-format`, which pinned to
        # the last PyPI release and caused bench to return N/A for every
        # crumb that used features newer than that release (v=1.2, v=1.3,
        # kind=agent, kind=delta, ...).
        run: |
          if grep -q '^name = "crumb-format"' pyproject.toml 2>/dev/null; then
            echo "Installing crumb-format from local checkout"
            pip install .
          else
            echo "Installing crumb-format from PyPI"
            pip install crumb-format
          fi

      - name: Inventory and validate .crumb files
        id: bench
        shell: bash
        run: |
          SEARCH_PATH="${{ inputs.search-path || '.' }}"
          # -type f because .crumb is also a directory name in this repo, and
          # the deliberately-invalid fixtures are excluded: the conformance
          # reject cases and fixtures/invalid exist precisely to be rejected,
          # so listing them as failures would be noise, not signal.
          mapfile -t CRUMB_FILES < <(
            find "$SEARCH_PATH" -type f -name "*.crumb" \
              -not -path "*/.git/*" \
              -not -path "*/conformance/cases/reject-*" \
              -not -path "*/fixtures/invalid/*" | sort
          )

          if [ ${#CRUMB_FILES[@]} -eq 0 ]; then
            echo "No .crumb files found."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

          # Columns are facts, not judgements. This table used to publish a
          # Score, a letter Grade, and a "Compression" ratio measured against a
          # squeezed copy of the same file. All three were invented by the tool
          # that reported them, and the ratio was misleading in the expensive
          # direction -- it printed 1.3x for a crumb that measures 9.0x against
          # the conversation it was actually compressed from. Token counts now
          # come from a real tokenizer and the table says which one.
          python -m pip install --quiet tiktoken || true

          TABLE="| File | Kind | Wire | Tokens | Valid |"
          TABLE+=$'\n'"|------|------|------|--------|-------|"

          for file in "${CRUMB_FILES[@]}"; do
            echo "::group::$file"
            ROW=$(python - "$file" <<'PY' || echo "| \`$file\` | - | - | - | parse error |"
          import sys
          from pathlib import Path
          import crumb_core
          from cli.measure import count_tokens

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          try:
              parsed = crumb_core.parse_crumb(text)
          except ValueError as exc:
              print(f"| `{path}` | - | - | - | rejected: {exc} |")
              raise SystemExit(0)
          tokens, method = count_tokens(text)
          headers = parsed["headers"]
          print(f"| `{path}` | {headers['kind']} | {headers.get('v','?')} | {tokens} | ok |")
          PY
          )
            echo "$ROW"
            echo "::endgroup::"
            TABLE+=$'\n'"$ROW"
          done

          TOKENIZER=$(python -c "from cli.measure import count_tokens; print(count_tokens('x')[1])")
          echo "$TABLE" > /tmp/bench-table.md
          echo "$TOKENIZER" > /tmp/bench-tokenizer.txt

      - name: Post PR comment
        if: steps.bench.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const table = fs.readFileSync('/tmp/bench-table.md', 'utf8');

            const tokenizer = fs.readFileSync('/tmp/bench-tokenizer.txt', 'utf8').trim();
            const body = `## CRUMB files in this PR\n\n${table}\n\n`
              + `Token counts via \`${tokenizer}\`. This table reports facts about each file — `
              + `it deliberately does not score them. To measure what compression actually cost, `
              + `compare a crumb against the source it came from:\n\n`
              + '```bash\ncrumb measure handoff.crumb --source conversation.json\n```\n\n'
              + `*[crumb-format](https://github.com/XioAISolutions/crumb-format)*`;

            // Determine the PR number. For workflow_call the context may differ.
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.warning('No pull request number found — skipping comment.');
              return;
            }

            // Check for an existing bench comment to update instead of spamming
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const marker = '## CRUMB files in this PR';
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info('Posted new bench comment');
            }

      - name: Post no-files notice
        if: steps.bench.outputs.found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '## CRUMB files in this PR\n\nNo `.crumb` files found in this repository.',
            });
