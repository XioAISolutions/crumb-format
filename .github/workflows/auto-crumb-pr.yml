# auto-crumb-pr.yml
#
# Reusable workflow: automatically generates a .crumb handoff file for every PR.
# Other repositories can reference this workflow via:
#
#   uses: your-org/crumb-format/.github/workflows/auto-crumb-pr.yml@main
#
# Or copy the template version (auto-crumb-template.yml) into your own repo.

name: Auto-Generate Crumb from PR

on:
  workflow_call:
    inputs:
      crumb-path:
        description: "Path to write the generated crumb file"
        required: false
        default: ".crumb/latest.crumb"
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  generate-crumb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install crumb-format
        # Prefer local install when running inside the crumb-format repo so
        # PRs test with their own code; fall back to PyPI for external callers.
        run: |
          if grep -q '^name = "crumb-format"' pyproject.toml 2>/dev/null; then
            pip install .
          else
            pip install crumb-format
          fi

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | head -100)
          {
            echo "files<<CRUMB_EOF"
            echo "$FILES"
            echo "CRUMB_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract PR description
        id: pr_info
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Extract first paragraph of PR body as the goal
          GOAL=$(echo "$PR_BODY" | awk '/^[[:space:]]*$/{if(found) exit} /[^[:space:]]/{found=1; print}')
          if [ -z "$GOAL" ]; then
            GOAL="$PR_TITLE"
          fi
          {
            echo "goal<<CRUMB_EOF"
            echo "$GOAL"
            echo "CRUMB_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "title=$PR_TITLE" >> "$GITHUB_OUTPUT"

      - name: Generate crumb file
        env:
          CRUMB_PATH: ${{ inputs.crumb-path }}
          PR_TITLE: ${{ steps.pr_info.outputs.title }}
          PR_GOAL: ${{ steps.pr_info.outputs.goal }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          mkdir -p "$(dirname "$CRUMB_PATH")"

          # Build the crumb content.
          #
          # This previously emitted YAML front matter -- "--- task: ...", a
          # "source:" line, and a closing "---" -- with no BEGIN CRUMB marker,
          # no v=, no kind=, and no END CRUMB. It was not a CRUMB at all, and
          # this workflow committed one to the repository on every pull request.
          # The reference implementation's own automation was producing files
          # its own validator rejects. `pr` and `generated` are not spec
          # headers, so they are carried as namespaced extension headers, which
          # SPEC §3.3 allows.
          cat > "$CRUMB_PATH" << CRUMB_EOF
          BEGIN CRUMB
          v=1.4
          kind=task
          title=${PR_TITLE}
          source=github.pr
          x-github.pr=${{ github.event.pull_request.number }}
          x-github.generated=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ---
          [goal]
          ${PR_GOAL}

          [context]
          Changed files in this PR:
          $(echo "$CHANGED_FILES" | sed 's/^/- /')

          [constraints]
          Review checklist: tests pass, no breaking changes, follows project conventions
          END CRUMB
          CRUMB_EOF

          # Strip leading whitespace from heredoc indentation
          sed -i 's/^          //' "$CRUMB_PATH"

      # A generated crumb that the validator rejects must never be committed.
      # This is the check whose absence let an invalid file sit in .crumb/ and
      # get regenerated on every PR.
      - name: Validate the generated crumb
        run: |
          python -m pip install --quiet .
          crumb validate "${{ inputs.crumb-path }}"

      - name: Check for changes
        id: diff
        run: |
          git add -N "${{ inputs.crumb-path }}"
          if git diff --quiet "${{ inputs.crumb-path }}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push crumb file
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.crumb-path }}"
          git commit -m "chore: auto-generate .crumb handoff for PR #${{ github.event.pull_request.number }}"
          git push
