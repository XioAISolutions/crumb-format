name: Continuous Deployment

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      version:
        description: 'Version to deploy (leave empty for latest)'
        required: false
        type: string

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/wavefield-llm
  KUBECTL_VERSION: '1.28.0'
  HELM_VERSION: '3.13.0'

jobs:
  # Determine deployment environment
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      version: ${{ steps.set-version.outputs.version }}
    
    steps:
      - name: Set environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi
      
      - name: Set version
        id: set-version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

  # Deploy to development
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [determine-environment]
    if: needs.determine-environment.outputs.environment == 'development'
    environment:
      name: development
      url: https://dev.wavefield-llm.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: us-east-1
      
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name wavefield-llm-dev --region us-east-1
      
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}
      
      - name: Deploy with Helm
        run: |
          helm upgrade --install wavefield-llm \
            deployment/kubernetes/helm/wavefield-llm \
            --namespace wavefield-llm-dev \
            --create-namespace \
            --set image.tag=${{ needs.determine-environment.outputs.version }} \
            --set environment=development \
            --set replicaCount=2 \
            --set resources.limits.memory=4Gi \
            --set resources.limits.cpu=2 \
            --wait \
            --timeout 10m
      
      - name: Run smoke tests
        run: |
          ./deployment/ci-cd/scripts/smoke-test.sh dev.wavefield-llm.example.com
      
      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Development deployment completed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [determine-environment]
    if: needs.determine-environment.outputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.wavefield-llm.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: us-east-1
      
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name wavefield-llm-staging --region us-east-1
      
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}
      
      - name: Deploy with Helm
        run: |
          helm upgrade --install wavefield-llm \
            deployment/kubernetes/helm/wavefield-llm \
            --namespace wavefield-llm-staging \
            --create-namespace \
            --set image.tag=${{ needs.determine-environment.outputs.version }} \
            --set environment=staging \
            --set replicaCount=3 \
            --set resources.limits.memory=8Gi \
            --set resources.limits.cpu=4 \
            --set autoscaling.enabled=true \
            --wait \
            --timeout 15m
      
      - name: Run smoke tests
        run: |
          ./deployment/ci-cd/scripts/smoke-test.sh staging.wavefield-llm.example.com
      
      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --base-url=https://staging.wavefield-llm.example.com \
            -v
      
      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Staging deployment completed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [determine-environment]
    if: needs.determine-environment.outputs.environment == 'production'
    environment:
      name: production
      url: https://api.wavefield-llm.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-east-1
      
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name wavefield-llm-prod --region us-east-1
      
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}
      
      - name: Create backup
        run: |
          ./deployment/ci-cd/scripts/backup-before-deploy.sh production
      
      - name: Deploy with Helm (Blue-Green)
        run: |
          # Deploy to green environment
          helm upgrade --install wavefield-llm-green \
            deployment/kubernetes/helm/wavefield-llm \
            --namespace wavefield-llm-prod \
            --create-namespace \
            --set image.tag=${{ needs.determine-environment.outputs.version }} \
            --set environment=production \
            --set nameOverride=wavefield-llm-green \
            --set replicaCount=5 \
            --set resources.limits.memory=16Gi \
            --set resources.limits.cpu=8 \
            --set autoscaling.enabled=true \
            --set autoscaling.minReplicas=5 \
            --set autoscaling.maxReplicas=20 \
            --wait \
            --timeout 20m
      
      - name: Run smoke tests on green
        run: |
          ./deployment/ci-cd/scripts/smoke-test.sh wavefield-llm-green.wavefield-llm-prod.svc.cluster.local
      
      - name: Run canary tests
        run: |
          ./deployment/ci-cd/scripts/canary-test.sh production green 10
      
      - name: Switch traffic to green
        run: |
          kubectl patch service wavefield-llm \
            -n wavefield-llm-prod \
            -p '{"spec":{"selector":{"app":"wavefield-llm-green"}}}'
      
      - name: Monitor for 5 minutes
        run: |
          ./deployment/ci-cd/scripts/monitor-deployment.sh production 300
      
      - name: Remove blue deployment
        if: success()
        run: |
          helm uninstall wavefield-llm-blue -n wavefield-llm-prod || true
          kubectl delete pods -l app=wavefield-llm-blue -n wavefield-llm-prod || true
      
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, rolling back..."
          kubectl patch service wavefield-llm \
            -n wavefield-llm-prod \
            -p '{"spec":{"selector":{"app":"wavefield-llm-blue"}}}'
          helm uninstall wavefield-llm-green -n wavefield-llm-prod
      
      - name: Update deployment record
        if: success()
        run: |
          ./deployment/ci-cd/scripts/record-deployment.sh \
            production \
            ${{ needs.determine-environment.outputs.version }} \
            ${{ github.sha }}
      
      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment completed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      
      - name: Create GitHub release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## Changes in this Release
            - Deployed to production
            - Version: ${{ needs.determine-environment.outputs.version }}
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false

  # Database migrations
  migrate-database:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [determine-environment]
    if: needs.determine-environment.outputs.environment != 'development'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install alembic psycopg2-binary
      
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alembic upgrade head
      
      - name: Verify migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alembic current

  # Update documentation
  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: needs.determine-environment.outputs.environment == 'production' && success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Build documentation
        run: |
          pip install sphinx sphinx-rtd-theme
          cd docs
          make html
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html

  # Post-deployment validation
  post-deployment-validation:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: needs.determine-environment.outputs.environment == 'production' && success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run end-to-end tests
        run: |
          pytest tests/e2e/ \
            --base-url=https://api.wavefield-llm.example.com \
            -v \
            --maxfail=1
      
      - name: Run load tests
        run: |
          ./deployment/ci-cd/scripts/load-test.sh production 100 300
      
      - name: Verify SLA compliance
        run: |
          ./deployment/ci-cd/scripts/verify-sla.sh production
      
      - name: Check error rates
        run: |
          ./deployment/ci-cd/scripts/check-error-rates.sh production 0.01

  # Rollback workflow
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure()
    needs: [deploy-production]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-east-1
      
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name wavefield-llm-prod --region us-east-1
      
      - name: Rollback Helm release
        run: |
          helm rollback wavefield-llm -n wavefield-llm-prod
      
      - name: Verify rollback
        run: |
          ./deployment/ci-cd/scripts/smoke-test.sh api.wavefield-llm.example.com
      
      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: 'warning'
          text: '⚠️ Production deployment rolled back'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

