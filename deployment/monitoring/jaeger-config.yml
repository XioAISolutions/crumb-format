# Metrics configuration
metrics:
  backend: prometheus
  http-route: /metrics
  
  # Prometheus configuration
  prometheus:
    namespace: jaeger
    subsystem: collector
    
    # Buckets for histograms
    buckets:
      - 0.001
      - 0.005
      - 0.01
      - 0.05
      - 0.1
      - 0.5
      - 1.0
      - 5.0
      - 10.0

# Logging configuration
log-level: info
log-format: json

# Health check configuration
health-check:
  http-port: 14269

# Admin configuration
admin:
  http:
    host-port: 0.0.0.0:14269

# Downsampling configuration
downsampling:
  ratio: 0.1
  hash-salt: "wavefield-llm-salt"

# Dependencies configuration
dependencies:
  # Dependency calculation interval
  calculation-interval: 1m
  
  # Lookback period
  lookback: 24h

# Multi-tenancy configuration
multi-tenancy:
  enabled: true
  header: "X-Tenant-ID"
  tenants:
    - production
    - staging
    - development

