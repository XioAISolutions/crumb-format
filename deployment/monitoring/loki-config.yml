# Loki Configuration for Wave Field LLM
# Production-grade log aggregation with multi-tenancy and retention policies

auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  log_format: json

distributor:
  ring:
    kvstore:
      store: consul
      consul:
        host: consul:8500
        http_client_timeout: 20s
        consistent_reads: true

ingester:
  lifecycler:
    address: 0.0.0.0
    ring:
      kvstore:
        store: consul
        consul:
          host: consul:8500
      replication_factor: 3
    num_tokens: 512
    heartbeat_period: 5s
    join_after: 30s
    min_ready_duration: 1m
    final_sleep: 30s
  
  chunk_idle_period: 5m
  chunk_retain_period: 30s
  max_chunk_age: 1h
  chunk_target_size: 1572864
  chunk_encoding: snappy
  
  wal:
    enabled: true
    dir: /loki/wal
    checkpoint_duration: 5m
    flush_on_shutdown: true
    replay_memory_ceiling: 4GB

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: s3
      schema: v11
      index:
        prefix: loki_index_
        period: 24h
    - from: 2024-06-01
      store: tsdb
      object_store: s3
      schema: v12
      index:
        prefix: loki_tsdb_index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/boltdb-cache
    cache_ttl: 24h
    shared_store: s3
  
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
    cache_ttl: 24h
    shared_store: s3
  
  aws:
    s3: s3://us-east-1/wavefield-llm-logs
    s3forcepathstyle: false
    bucketnames: wavefield-llm-logs
    region: us-east-1
    access_key_id: ${AWS_ACCESS_KEY_ID}
    secret_access_key: ${AWS_SECRET_ACCESS_KEY}
    sse_encryption: true
    http_config:
      idle_conn_timeout: 90s
      response_header_timeout: 0s
      insecure_skip_verify: false

compactor:
  working_directory: /loki/compactor
  shared_store: s3
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_label_name_length: 1024
  max_label_value_length: 2048
  max_label_names_per_series: 30
  max_global_streams_per_user: 10000
  max_chunks_per_query: 2000000
  max_query_length: 721h
  max_query_parallelism: 32
  max_streams_per_user: 0
  max_entries_limit_per_query: 5000
  max_cache_freshness_per_query: 10m
  split_queries_by_interval: 15m
  
  # Per-tenant limits
  per_tenant_override_config: /etc/loki/overrides.yaml
  
  # Retention periods by tenant
  retention_period: 744h  # 31 days default
  
  # Cardinality limits
  cardinality_limit: 100000
  max_streams_matchers_per_query: 1000
  max_concurrent_tail_requests: 10

chunk_store_config:
  max_look_back_period: 744h
  chunk_cache_config:
    enable_fifocache: true
    fifocache:
      max_size_bytes: 1GB
      ttl: 1h
  
  write_dedupe_cache_config:
    enable_fifocache: true
    fifocache:
      max_size_bytes: 500MB
      ttl: 10m

query_range:
  align_queries_with_step: true
  max_retries: 5
  parallelise_shardable_queries: true
  cache_results: true
  
  results_cache:
    cache:
      enable_fifocache: true
      fifocache:
        max_size_bytes: 500MB
        ttl: 24h

frontend:
  log_queries_longer_than: 5s
  compress_responses: true
  max_outstanding_per_tenant: 2048
  
  # Query scheduler
  scheduler_address: query-scheduler:9095

frontend_worker:
  frontend_address: query-frontend:9095
  parallelism: 10
  grpc_client_config:
    max_recv_msg_size: 104857600
    max_send_msg_size: 16777216

ruler:
  storage:
    type: s3
    s3:
      bucketnames: wavefield-llm-rules
      region: us-east-1
      access_key_id: ${AWS_ACCESS_KEY_ID}
      secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: consul
      consul:
        host: consul:8500
  enable_api: true
  enable_alertmanager_v2: true
  
  # Alert rules
  wal:
    dir: /loki/ruler-wal

table_manager:
  retention_deletes_enabled: true
  retention_period: 744h
  poll_interval: 10m
  creation_grace_period: 10m
  index_tables_provisioning:
    enable_ondemand_throughput_mode: true
    enable_inactive_throughput_on_demand_mode: true

analytics:
  reporting_enabled: false

# Multi-tenancy configuration
# Tenant overrides file: /etc/loki/overrides.yaml
# Example:
# overrides:
#   tenant1:
#     ingestion_rate_mb: 20
#     retention_period: 2160h  # 90 days
#   tenant2:
#     ingestion_rate_mb: 5
#     retention_period: 168h   # 7 days

# Common labels for all logs
common_config:
  path_prefix: /loki
  replication_factor: 3
  ring:
    kvstore:
      store: consul
      consul:
        host: consul:8500
        http_client_timeout: 20s

# Tracing configuration
tracing:
  enabled: true
  jaeger:
    agent_host: jaeger-agent
    agent_port: 6831
    sampler_type: probabilistic
    sampler_param: 0.1

