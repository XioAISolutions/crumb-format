apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wavefield-llm-ingress
  namespace: wavefield
  labels:
    app: wavefield-llm
  annotations:
    # NGINX Ingress Controller
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    
    # Body size
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    
    # Certificate management (cert-manager)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # AWS ALB (alternative to NGINX)
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.wavefield.ai
    - wavefield.ai
    secretName: wavefield-tls-cert
  rules:
  - host: api.wavefield.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wavefield-llm
            port:
              name: http
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: wavefield-llm
            port:
              name: http
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: wavefield-llm
            port:
              name: metrics
  
  - host: wavefield.ai
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: wavefield-llm
            port:
              name: http

---
# Internal ingress for GPU endpoints
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wavefield-llm-gpu-ingress
  namespace: wavefield
  labels:
    app: wavefield-llm
    component: gpu
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    kubernetes.io/ingress.class: "nginx-internal"
spec:
  ingressClassName: nginx-internal
  tls:
  - hosts:
    - gpu.wavefield.internal
    secretName: wavefield-internal-tls
  rules:
  - host: gpu.wavefield.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wavefield-llm-gpu
            port:
              name: http

---
# Canary ingress for gradual rollouts
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wavefield-llm-canary
  namespace: wavefield
  labels:
    app: wavefield-llm
    deployment: canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
    nginx.ingress.kubernetes.io/canary-by-header-value: "always"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.wavefield.ai
    secretName: wavefield-tls-cert
  rules:
  - host: api.wavefield.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wavefield-llm-canary
            port:
              name: http

