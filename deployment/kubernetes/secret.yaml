# Secret manifest template for Wave Field LLM
# IMPORTANT: Do not commit actual secrets to version control
# Use external secret management (Vault, AWS Secrets Manager, etc.)

apiVersion: v1
kind: Secret
metadata:
  name: wavefield-secrets
  namespace: wavefield
  labels:
    app: wavefield-llm
type: Opaque
stringData:
  # Database credentials (replace with actual values)
  POSTGRES_URL: "postgresql://wavefield:CHANGE_ME@postgres:5432/wavefield"
  POSTGRES_USER: "wavefield"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "wavefield"
  
  # Redis credentials
  REDIS_URL: "redis://:CHANGE_ME@redis:6379/0"
  REDIS_PASSWORD: "CHANGE_ME"
  
  # API keys
  API_KEY: "CHANGE_ME"
  API_SECRET: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
  
  # External service credentials
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  
  # Monitoring
  SENTRY_DSN: ""
  DATADOG_API_KEY: ""
  
  # Encryption keys
  ENCRYPTION_KEY: "CHANGE_ME"

---
# TLS certificate secret (managed by cert-manager)
apiVersion: v1
kind: Secret
metadata:
  name: wavefield-tls-cert
  namespace: wavefield
  labels:
    app: wavefield-llm
type: kubernetes.io/tls
data:
  # These will be populated by cert-manager
  tls.crt: ""
  tls.key: ""

---
# Docker registry credentials
apiVersion: v1
kind: Secret
metadata:
  name: wavefield-registry-credentials
  namespace: wavefield
  labels:
    app: wavefield-llm
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: |
    {
      "auths": {
        "registry.example.com": {
          "username": "CHANGE_ME",
          "password": "CHANGE_ME",
          "email": "team@wavefield.ai",
          "auth": "BASE64_ENCODED_USERNAME:PASSWORD"
        }
      }
    }

---
# Service account for external secret management
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wavefield-llm
  namespace: wavefield
  labels:
    app: wavefield-llm
  annotations:
    # AWS IAM role for service account (IRSA)
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/wavefield-llm-role"
    # GCP Workload Identity
    iam.gke.io/gcp-service-account: "wavefield-llm@PROJECT_ID.iam.gserviceaccount.com"
imagePullSecrets:
- name: wavefield-registry-credentials

---
# External Secrets Operator integration (optional)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: wavefield-secret-store
  namespace: wavefield
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: wavefield-llm

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wavefield-external-secrets
  namespace: wavefield
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: wavefield-secret-store
    kind: SecretStore
  target:
    name: wavefield-secrets
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: wavefield/postgres
      property: password
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: wavefield/redis
      property: password
  - secretKey: API_KEY
    remoteRef:
      key: wavefield/api
      property: key
  - secretKey: JWT_SECRET
    remoteRef:
      key: wavefield/jwt
      property: secret

---
# HashiCorp Vault integration (alternative)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: wavefield-vault-auth
  namespace: wavefield
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: wavefield-llm
    serviceAccount: wavefield-llm

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: wavefield-vault-secrets
  namespace: wavefield
spec:
  type: kv-v2
  mount: secret
  path: wavefield/production
  destination:
    name: wavefield-secrets
    create: true
  refreshAfter: 1h
  vaultAuthRef: wavefield-vault-auth

