# Horizontal Pod Autoscaler for Wave Field LLM
# Automatically scales pods based on CPU, memory, and custom metrics

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wavefield-llm-hpa
  namespace: wavefield
  labels:
    app: wavefield-llm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wavefield-llm
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  # Custom metrics - Request rate
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "100"
  
  # Custom metrics - Request latency
  - type: Pods
    pods:
      metric:
        name: http_request_duration_seconds
      target:
        type: AverageValue
        averageValue: "500m"
  
  # Custom metrics - Queue depth
  - type: Pods
    pods:
      metric:
        name: request_queue_depth
      target:
        type: AverageValue
        averageValue: "10"

---
# GPU deployment HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wavefield-llm-gpu-hpa
  namespace: wavefield
  labels:
    app: wavefield-llm
    component: gpu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wavefield-llm-gpu
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  
  # GPU utilization (requires GPU metrics)
  - type: Pods
    pods:
      metric:
        name: gpu_utilization
      target:
        type: AverageValue
        averageValue: "70"
  
  # GPU memory utilization
  - type: Pods
    pods:
      metric:
        name: gpu_memory_utilization
      target:
        type: AverageValue
        averageValue: "80"

---
# Vertical Pod Autoscaler (VPA) - for resource recommendations
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: wavefield-llm-vpa
  namespace: wavefield
  labels:
    app: wavefield-llm
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wavefield-llm
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: wavefield-api
      minAllowed:
        cpu: 500m
        memory: 1Gi
      maxAllowed:
        cpu: 8000m
        memory: 16Gi
      controlledResources:
      - cpu
      - memory
      mode: Auto

---
# KEDA ScaledObject for advanced autoscaling
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: wavefield-llm-keda
  namespace: wavefield
  labels:
    app: wavefield-llm
spec:
  scaleTargetRef:
    name: wavefield-llm
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 3
  maxReplicaCount: 20
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Percent
            value: 50
            periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
          - type: Percent
            value: 100
            periodSeconds: 30
  triggers:
  # Prometheus-based scaling
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: http_requests_per_second
      threshold: "100"
      query: |
        sum(rate(http_requests_total{job="wavefield-llm"}[2m]))
  
  # Redis queue length
  - type: redis
    metadata:
      address: redis:6379
      listName: inference_queue
      listLength: "10"
      databaseIndex: "0"
      passwordFromEnv: REDIS_PASSWORD
  
  # CPU-based (fallback)
  - type: cpu
    metricType: Utilization
    metadata:
      value: "70"
  
  # Memory-based (fallback)
  - type: memory
    metricType: Utilization
    metadata:
      value: "80"
  
  # Cron-based scaling for predictable load patterns
  - type: cron
    metadata:
      timezone: America/New_York
      start: 0 8 * * 1-5
      end: 0 18 * * 1-5
      desiredReplicas: "10"
  
  - type: cron
    metadata:
      timezone: America/New_York
      start: 0 18 * * 1-5
      end: 0 8 * * 1-5
      desiredReplicas: "3"

