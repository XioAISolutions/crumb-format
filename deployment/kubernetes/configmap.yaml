apiVersion: v1
kind: ConfigMap
metadata:
  name: wavefield-config
  namespace: wavefield
  labels:
    app: wavefield-llm
data:
  # Application configuration
  WAVE_FIELD_ENV: "production"
  WAVE_FIELD_LOG_LEVEL: "INFO"
  WAVE_FIELD_LOG_FORMAT: "json"
  
  # Model configuration
  MODEL_CACHE_DIR: "/app/models"
  MODEL_MAX_LENGTH: "2048"
  MODEL_BATCH_SIZE: "8"
  MODEL_NUM_BEAMS: "4"
  
  # API configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "4"
  API_TIMEOUT: "300"
  API_MAX_REQUESTS: "1000"
  API_KEEPALIVE: "5"
  
  # Cache configuration
  CACHE_ENABLED: "true"
  CACHE_TTL: "3600"
  CACHE_MAX_SIZE: "1000"
  
  # Rate limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "60"
  
  # Monitoring
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  TRACING_ENABLED: "true"
  TRACING_SAMPLE_RATE: "0.1"
  
  # Performance tuning
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  TORCH_NUM_THREADS: "4"
  
  # Feature flags
  ENABLE_STREAMING: "true"
  ENABLE_QUANTIZATION: "true"
  ENABLE_FLASH_ATTENTION: "true"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wavefield-redis-config
  namespace: wavefield
  labels:
    app: redis
data:
  redis.conf: |
    # Redis configuration for Wave Field LLM
    
    # Network
    bind 0.0.0.0
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    
    # General
    daemonize no
    supervised no
    pidfile /var/run/redis.pid
    loglevel notice
    databases 16
    
    # Snapshotting
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data
    
    # Replication
    replica-serve-stale-data yes
    replica-read-only yes
    repl-diskless-sync no
    repl-diskless-sync-delay 5
    
    # Security
    requirepass ${REDIS_PASSWORD}
    
    # Memory management
    maxmemory 2gb
    maxmemory-policy allkeys-lru
    maxmemory-samples 5
    
    # Append only mode
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    
    # Slow log
    slowlog-log-slower-than 10000
    slowlog-max-len 128
    
    # Latency monitor
    latency-monitor-threshold 100

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wavefield-postgres-config
  namespace: wavefield
  labels:
    app: postgres
data:
  postgresql.conf: |
    # PostgreSQL configuration for Wave Field LLM
    
    # Connection settings
    listen_addresses = '*'
    port = 5432
    max_connections = 100
    superuser_reserved_connections = 3
    
    # Memory settings
    shared_buffers = 256MB
    effective_cache_size = 1GB
    maintenance_work_mem = 64MB
    work_mem = 16MB
    
    # WAL settings
    wal_level = replica
    max_wal_size = 1GB
    min_wal_size = 80MB
    wal_buffers = 16MB
    
    # Query tuning
    random_page_cost = 1.1
    effective_io_concurrency = 200
    
    # Logging
    logging_collector = on
    log_directory = 'log'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_rotation_age = 1d
    log_rotation_size = 100MB
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_timezone = 'UTC'
    
    # Autovacuum
    autovacuum = on
    autovacuum_max_workers = 3
    autovacuum_naptime = 1min
    
    # Statistics
    track_activities = on
    track_counts = on
    track_io_timing = on
    track_functions = all
    
  pg_hba.conf: |
    # PostgreSQL Client Authentication Configuration
    
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    local   all             all                                     trust
    host    all             all             127.0.0.1/32            md5
    host    all             all             ::1/128                 md5
    host    all             all             0.0.0.0/0               md5
    host    replication     all             0.0.0.0/0               md5

