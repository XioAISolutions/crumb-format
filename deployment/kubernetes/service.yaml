apiVersion: v1
kind: Service
metadata:
  name: wavefield-llm
  namespace: wavefield
  labels:
    app: wavefield-llm
    component: api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  selector:
    app: wavefield-llm
    component: api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: wavefield-llm-headless
  namespace: wavefield
  labels:
    app: wavefield-llm
    component: api
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: wavefield-llm
    component: api
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: wavefield-llm-gpu
  namespace: wavefield
  labels:
    app: wavefield-llm
    component: api-gpu
spec:
  type: ClusterIP
  selector:
    app: wavefield-llm
    component: api-gpu
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: wavefield-llm-internal
  namespace: wavefield
  labels:
    app: wavefield-llm
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: wavefield-llm
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP

