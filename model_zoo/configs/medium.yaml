# Wave Field LLM - Medium Model Configuration
# 350M parameters - High-performance model for production use

model:
  name: wavefield-medium
  version: 1.0.0
  description: "Medium Wave Field LLM for production language tasks"
  
  architecture:
    dim: 1024                  # Hidden dimension
    n_layers: 24               # Number of transformer layers
    n_heads: 16                # Number of attention heads
    field_size: 1024           # Wave field size
    vocab_size: 50257          # GPT-2 tokenizer vocab size
    max_seq_len: 8192          # Maximum sequence length
    dropout: 0.1               # Dropout rate
    use_flash_attention: true  # Flash attention (requires GPU)
    
  wave_field:
    wave_dim: 128              # Wave dimension
    num_frequencies: 32        # Number of frequency components
    phase_shift: true          # Enable phase shifting
    amplitude_modulation: true # Enable amplitude modulation

training:
  # Training budget
  total_tokens: 300_000_000_000  # 300B tokens
  batch_size: 128                 # Per-device batch size
  gradient_accumulation: 16       # Gradient accumulation steps
  effective_batch_size: 2048      # batch_size * gradient_accumulation
  
  # Optimization
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  
  # Learning rate schedule
  warmup_steps: 10000
  max_steps: 500000
  lr_decay_style: "cosine"
  
  # Precision
  mixed_precision: "bf16"      # bf16 for better stability
  
  # Checkpointing
  save_interval: 5000
  eval_interval: 2500
  keep_last_n_checkpoints: 15
  
  # Early stopping
  early_stopping_patience: 30
  early_stopping_metric: "val_loss"
  
  # Advanced optimization
  use_fused_adam: true
  use_gradient_checkpointing: true

dataset:
  # Dataset mixture (weights sum to 1.0)
  mix:
    c4: 0.30                   # C4 web corpus
    wikipedia: 0.15            # Wikipedia
    books: 0.15                # Books corpus
    github: 0.15               # GitHub code
    arxiv: 0.10                # ArXiv papers
    stackexchange: 0.08        # StackExchange
    openwebtext: 0.05          # OpenWebText
    pile: 0.02                 # The Pile
  
  # Data processing
  seq_length: 8192
  num_workers: 16
  prefetch_factor: 4
  
  # Validation
  val_split: 0.002
  val_samples: 100000

hardware:
  # Hardware requirements
  min_gpus: 8
  recommended_gpus: 16
  gpu_memory_gb: 40
  cpu_cores: 64
  ram_gb: 256

logging:
  # Logging configuration
  log_interval: 100
  wandb_project: "wavefield-llm"
  wandb_entity: null
  tensorboard: true
  log_dir: "logs/wavefield-medium"

evaluation:
  # Evaluation benchmarks
  benchmarks:
    - "perplexity"
    - "lambada"
    - "hellaswag"
    - "winogrande"
    - "arc_easy"
    - "arc_challenge"
    - "mmlu"
    - "truthfulqa"
    - "humaneval"
    - "mbpp"
  
  # Evaluation frequency
  eval_during_training: true
  eval_steps: 2500

distributed:
  # Distributed training settings
  backend: "nccl"
  find_unused_parameters: false
  gradient_as_bucket_view: true
  static_graph: true
  
  # FSDP settings
  use_fsdp: true
  fsdp_sharding_strategy: "FULL_SHARD"
  fsdp_cpu_offload: false
  fsdp_backward_prefetch: "BACKWARD_PRE"

