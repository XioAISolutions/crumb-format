# Wave Field LLM - Small Code-Specialized Model Configuration
# 25M parameters - Optimized for code generation and understanding

model:
  name: wavefield-small-code
  version: 1.0.0
  description: "Code-specialized Wave Field LLM for programming tasks"
  base_model: "wavefield-small"
  specialization: "code"
  
  architecture:
    dim: 512                   # Hidden dimension
    n_layers: 8                # Number of transformer layers
    n_heads: 8                 # Number of attention heads
    field_size: 512            # Wave field size
    vocab_size: 50257          # GPT-2 tokenizer vocab size
    max_seq_len: 8192          # Longer context for code
    dropout: 0.1               # Dropout rate
    use_flash_attention: true  # Flash attention (requires GPU)
    
  wave_field:
    wave_dim: 64               # Wave dimension
    num_frequencies: 16        # Number of frequency components
    phase_shift: true          # Enable phase shifting
    amplitude_modulation: true # Enable amplitude modulation

training:
  # Training strategy: Start from wavefield-small checkpoint
  resume_from: "models/wavefield-small/checkpoint-best.pt"
  
  # Training budget (fine-tuning)
  total_tokens: 50_000_000_000   # 50B tokens
  batch_size: 128                 # Per-device batch size
  gradient_accumulation: 16       # Gradient accumulation steps
  effective_batch_size: 2048      # batch_size * gradient_accumulation
  
  # Optimization
  learning_rate: 3.0e-4          # Lower LR for fine-tuning
  min_learning_rate: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  
  # Learning rate schedule
  warmup_steps: 2000
  max_steps: 100000
  lr_decay_style: "cosine"
  
  # Precision
  mixed_precision: "bf16"
  
  # Checkpointing
  save_interval: 2000
  eval_interval: 1000
  keep_last_n_checkpoints: 10
  
  # Early stopping
  early_stopping_patience: 15
  early_stopping_metric: "code_eval_pass@1"

dataset:
  # Code-focused dataset mixture (weights sum to 1.0)
  mix:
    github: 0.40               # GitHub code
    stackexchange: 0.20        # StackExchange (programming)
    arxiv_cs: 0.10             # CS papers from ArXiv
    documentation: 0.10        # API documentation
    jupyter_notebooks: 0.10    # Jupyter notebooks
    code_contests: 0.05        # Competitive programming
    c4_code: 0.05              # Code snippets from C4
  
  # Data processing
  seq_length: 8192             # Longer sequences for code
  num_workers: 8
  prefetch_factor: 4
  
  # Validation
  val_split: 0.005
  val_samples: 25000
  
  # Code-specific preprocessing
  preserve_indentation: true
  include_comments: true
  filter_min_lines: 10

hardware:
  # Hardware requirements
  min_gpus: 4
  recommended_gpus: 8
  gpu_memory_gb: 24
  cpu_cores: 32
  ram_gb: 128

logging:
  # Logging configuration
  log_interval: 50
  wandb_project: "wavefield-llm-code"
  wandb_entity: null
  tensorboard: true
  log_dir: "logs/wavefield-small-code"

evaluation:
  # Code-specific evaluation benchmarks
  benchmarks:
    - "humaneval"              # Python code generation
    - "mbpp"                   # Python programming problems
    - "apps"                   # Competitive programming
    - "codexglue"              # Code understanding
    - "ds1000"                 # Data science code
    - "code_perplexity"        # Code perplexity
  
  # Evaluation frequency
  eval_during_training: true
  eval_steps: 1000
  
  # Code evaluation settings
  code_eval_timeout: 10        # Seconds per test
  code_eval_num_samples: 100   # Samples for pass@k

distributed:
  # Distributed training settings
  backend: "nccl"
  find_unused_parameters: false
  gradient_as_bucket_view: true
  static_graph: true

