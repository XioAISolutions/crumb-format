# Wave Field LLM - Large Model Configuration
# 1.5B parameters - State-of-the-art model for demanding tasks

model:
  name: wavefield-large
  version: 1.0.0
  description: "Large Wave Field LLM for state-of-the-art language understanding"
  
  architecture:
    dim: 2048                  # Hidden dimension
    n_layers: 32               # Number of transformer layers
    n_heads: 32                # Number of attention heads
    field_size: 2048           # Wave field size
    vocab_size: 50257          # GPT-2 tokenizer vocab size
    max_seq_len: 16384         # Maximum sequence length
    dropout: 0.1               # Dropout rate
    use_flash_attention: true  # Flash attention (requires GPU)
    
  wave_field:
    wave_dim: 256              # Wave dimension
    num_frequencies: 64        # Number of frequency components
    phase_shift: true          # Enable phase shifting
    amplitude_modulation: true # Enable amplitude modulation

training:
  # Training budget
  total_tokens: 1_000_000_000_000  # 1T tokens
  batch_size: 64                    # Per-device batch size
  gradient_accumulation: 32         # Gradient accumulation steps
  effective_batch_size: 2048        # batch_size * gradient_accumulation
  
  # Optimization
  learning_rate: 2.0e-4
  min_learning_rate: 2.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  
  # Learning rate schedule
  warmup_steps: 20000
  max_steps: 1000000
  lr_decay_style: "cosine"
  
  # Precision
  mixed_precision: "bf16"      # bf16 for better stability
  
  # Checkpointing
  save_interval: 10000
  eval_interval: 5000
  keep_last_n_checkpoints: 20
  
  # Early stopping
  early_stopping_patience: 50
  early_stopping_metric: "val_loss"
  
  # Advanced optimization
  use_fused_adam: true
  use_gradient_checkpointing: true
  use_cpu_offload: false

dataset:
  # Dataset mixture (weights sum to 1.0)
  mix:
    c4: 0.25                   # C4 web corpus
    wikipedia: 0.15            # Wikipedia
    books: 0.15                # Books corpus
    github: 0.15               # GitHub code
    arxiv: 0.12                # ArXiv papers
    stackexchange: 0.08        # StackExchange
    openwebtext: 0.05          # OpenWebText
    pile: 0.05                 # The Pile
  
  # Data processing
  seq_length: 16384
  num_workers: 32
  prefetch_factor: 4
  
  # Validation
  val_split: 0.001
  val_samples: 200000

hardware:
  # Hardware requirements
  min_gpus: 16
  recommended_gpus: 32
  gpu_memory_gb: 80
  cpu_cores: 128
  ram_gb: 512

logging:
  # Logging configuration
  log_interval: 200
  wandb_project: "wavefield-llm"
  wandb_entity: null
  tensorboard: true
  log_dir: "logs/wavefield-large"

evaluation:
  # Evaluation benchmarks
  benchmarks:
    - "perplexity"
    - "lambada"
    - "hellaswag"
    - "winogrande"
    - "arc_easy"
    - "arc_challenge"
    - "mmlu"
    - "truthfulqa"
    - "humaneval"
    - "mbpp"
    - "gsm8k"
    - "math"
  
  # Evaluation frequency
  eval_during_training: true
  eval_steps: 5000

distributed:
  # Distributed training settings
  backend: "nccl"
  find_unused_parameters: false
  gradient_as_bucket_view: true
  static_graph: true
  
  # FSDP settings
  use_fsdp: true
  fsdp_sharding_strategy: "FULL_SHARD"
  fsdp_cpu_offload: false
  fsdp_backward_prefetch: "BACKWARD_PRE"
  fsdp_auto_wrap_policy: "transformer_auto_wrap_policy"
  
  # Pipeline parallelism
  use_pipeline_parallel: false
  pipeline_parallel_size: 1
  
  # Tensor parallelism
  use_tensor_parallel: false
  tensor_parallel_size: 1

