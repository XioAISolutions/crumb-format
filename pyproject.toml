[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crumb-format"
version = "1.1.0"
description = "The copy-paste AI handoff format — v1.4 wire format (stable). Native Claude Code and Cursor integrations, MCP servers (24 tools), validators (Python + JS), AgentAuth identity/governance/audit, palace memory, MeTalk compression, OTEL bridge, and ~46 CLI commands."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "XIO AI Solutions" }]
keywords = ["ai", "handoff", "llm", "context", "prompt-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/XioAISolutions/crumb-format"
Repository = "https://github.com/XioAISolutions/crumb-format"

[project.scripts]
crumb = "crumb_cli:main"
agentauth-mcp = "mcp.agentauth_server:main"

[tool.setuptools]
py-modules = ["crumb_cli"]
packages = [
    "cli",
    "agentauth",
    "mcp",
    "api",
    "a2a",
    "crumb_llm",
    "crumb_llm.configs",
]

[tool.setuptools.package-data]
"crumb_llm.configs" = ["*.json"]

[project.optional-dependencies]
llm = [
    "torch>=2.2",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
