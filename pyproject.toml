[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crumb-format"
version = "1.2.0"
description = "Move AI session context between tools. Capture a conversation from Claude Code, OpenAI, Anthropic or ChatGPT into a compact handoff — and measure what the compression cost."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "XIO AI Solutions" }]
keywords = ["ai", "handoff", "llm", "context", "prompt-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/XioAISolutions/crumb-format"
Repository = "https://github.com/XioAISolutions/crumb-format"

[project.scripts]
crumb = "crumb_cli:main"
agentauth-mcp = "mcp.agentauth_server:main"

[tool.setuptools]
py-modules = ["crumb_cli"]
packages = [
    "crumb_core",
    "cli",
    "agentauth",
    "mcp",
    "api",
    "a2a",
]
# crumb_wavelm — the experimental wave-field language model — is deliberately
# NOT packaged here. It is ~4,600 lines of PyTorch research code with nothing
# to do with the wire format, and shipping it inside the format's wheel made
# `pip install crumb-format` carry a homegrown LM. The source stays in this
# repository and `python -m crumb_wavelm.setup_standalone` builds it as its own
# distribution.

[project.optional-dependencies]
# Kept so `pip install 'crumb-format[llm]'` still resolves for anyone with it
# pinned, but the model itself is no longer bundled — see the packages note
# above and run crumb_wavelm.setup_standalone to build it separately.
llm = [
    "torch>=2.2",
    "numpy>=1.26",
]
# Exact token counting for `crumb measure`. Without it the CLI falls back to
# a chars/4 heuristic and labels every number it prints as approximate.
measure = [
    "tiktoken>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
